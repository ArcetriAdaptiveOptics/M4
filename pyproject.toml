[build-system]
requires = ["setuptools>=77"]  # PEP 639 license string
build-backend = "setuptools.build_meta"

[project]
name = "m4"
description = "A suite of tools to calibrate ELT M4 deformable mirror"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
    { name = "Marco Xompero" },
    { name = "Chiara Selmi" },
    { name = "Runa Briguglio" },
    { name = "Pietro Ferraiuolo" },
]
license = "MIT"
keywords = [
    "Adaptive Optics", "Astrophysics", "INAF", "Arcetri"
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    # snake_case API (get_iff_config, find_tracknum, ...) requires >= 2.2.0
    "opticalib>=2.2.0",
    "numpy",
    "scipy",
    "h5py",
    "pandas",
    "tabulate",
    "opcua",
    "cryptography",
    "pyzmq",
]

[project.urls]
Homepage = "https://github.com/ArcetriAdaptiveOptics/M4"

[project.optional-dependencies]
sound = ["playsound==1.2.2"]
gui = [
    "opticalib[gui]",  # Qt binding used by m4.gui.calpygui
    "guietta",  # legacy m4.gui.ott_monitoring_GUI
]
test = ["pytest", "pytest-cov", "mock"]
docs = [
    "sphinx>=1.7.5",
    "numpy>1.17",
    "scipy",
    "matplotlib",
    "astropy",
    "h5py",
    "scikit-image",
    "opcua",
    "pyzmq",
    "ruamel.yaml",
]

[project.gui-scripts]
m4gui = "m4.gui.m4gui:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "m4.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["m4*"]

[tool.pytest.ini_options]
testpaths = ["test"]
